<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Pages</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 280px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .card a {
            display: inline-block;
            text-decoration: none;
            background: #222;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
        }

        .card a:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <h1>My Landing Pages</h1>

    <p>Explore my three landing page projects</p>

    <div class="container">

        <div class="card">
            <h2>Nova Pay</h2>
            <a href="Nova-Pay/index.html">View Page</a>
        </div>

        <div class="card">
            <h2>Restaurant</h2>
            <a href="Restaurant/index.html">View Page</a>
        </div>

        <div class="card">
            <h2>TripVista</h2>
            <a href="TripVista/index.html">View Page</a>
        </div>

    </div>

</body>
</html>
